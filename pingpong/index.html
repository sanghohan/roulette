<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏓 탁구 커뮤니티 · donjiral</title>
<style>
  :root{
    --bg:#0f1226; --card:#1a1f3d; --card2:#232a52; --line:#2e376a;
    --txt:#eef1ff; --sub:#9aa3d4; --accent:#1fb6a6; --accent2:#ffd93d;
    --good:#4ade80; --blue:#60a5fa; --red:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI','Apple SD Gothic Neo',system-ui,sans-serif}
  body{background:radial-gradient(1200px 600px at 50% -10%,#15324a,#0f1226);color:var(--txt);min-height:100vh;padding:20px}
  .wrap{max-width:880px;margin:0 auto}
  header{text-align:center;margin-bottom:12px}
  header h1{font-size:30px;letter-spacing:-.5px}
  header p{color:var(--sub);margin-top:6px;font-size:14px}
  .nav{text-align:center;margin-top:10px;font-size:13px}
  .nav a{color:var(--blue);text-decoration:none;margin:0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .toolbar input{flex:1;min-width:140px;background:#0e1230;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:14px}
  .btn{background:var(--accent);color:#04201d;border:none;border-radius:11px;padding:10px 16px;font-size:14px;font-weight:800;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)}
  .btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:600}
  .btn.sm{padding:7px 11px;font-size:12px}
  .cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .cat{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--sub);cursor:pointer;font-size:13px}
  .cat.on{background:var(--accent);color:#04201d;border-color:var(--accent);font-weight:700}
  /* 목록 */
  .list{display:flex;flex-direction:column}
  .post{display:flex;gap:12px;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
  .post:hover{background:#ffffff08}
  .thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#0e1230}
  .post .body{flex:1;min-width:0}
  .post .badge{font-size:11px;color:var(--accent2);font-weight:700}
  .post .title{font-size:15px;font-weight:600;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .post .meta{font-size:12px;color:var(--sub)}
  .post .meta span{margin-right:10px}
  .empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
  /* 상세 */
  .detail .badge{font-size:12px;color:var(--accent2);font-weight:700}
  .detail h2{font-size:20px;margin:6px 0}
  .detail .meta{font-size:12px;color:var(--sub);margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:12px}
  .detail .content{font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .detail img.media{max-width:100%;border-radius:12px;margin:12px 0}
  .detail video.media{max-width:100%;border-radius:12px;margin:12px 0}
  .likebar{display:flex;gap:10px;align-items:center;margin:16px 0}
  .comments{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .comment{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px}
  .comment .who{color:var(--blue);font-weight:600;font-size:13px} .comment .ct{color:var(--sub);font-size:11px;float:right}
  .comment .cx{font-size:14px;margin-top:3px;white-space:pre-wrap}
  /* 폼 */
  .form label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  .form input,.form select,.form textarea{width:100%;background:#0e1230;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:14px}
  .form textarea{min-height:160px;resize:vertical;line-height:1.6}
  .hidden{display:none}
  .note{color:var(--sub);font-size:12px;line-height:1.5}
  .banner{background:#13343a;border:1px solid #1c6e63;color:#bdeee6;border-radius:12px;padding:11px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.5}
  @media(max-width:640px){
    body{padding:12px} header h1{font-size:24px}
    .card{padding:14px;border-radius:14px}
    .thumb{width:44px;height:44px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏓 탁구 커뮤니티</h1>
    <p>같이 치고, 장비 나누고, 멋진 랠리를 공유하는 공간</p>
    <div class="nav"><a href="/">🍽️ 메뉴</a> · <a href="/outfit/">👕 의상</a> · <a href="/pingpong/">🏓 탁구</a></div>
  </header>

  <div class="banner">ℹ️ 지금은 미리보기 버전이라 글은 <b>이 브라우저에만</b> 저장돼요. 곧 서버를 붙이면 모두가 함께 보는 진짜 게시판이 됩니다.</div>

  <!-- 목록 화면 -->
  <div class="card" id="listView">
    <div class="toolbar">
      <input id="search" placeholder="🔍 제목·내용·작성자 검색">
      <button class="btn" id="writeBtn">✏️ 글쓰기</button>
    </div>
    <div class="cats" id="cats"></div>
    <div class="list" id="list"></div>
  </div>

  <!-- 상세 화면 -->
  <div class="card detail hidden" id="detailView"></div>

  <!-- 글쓰기 화면 -->
  <div class="card form hidden" id="writeView">
    <h2 style="font-size:18px">✏️ 새 글 쓰기</h2>
    <label>게시판</label>
    <select id="wCat"></select>
    <label>제목</label>
    <input id="wTitle" placeholder="제목을 입력하세요">
    <label>작성자</label>
    <input id="wAuthor" placeholder="닉네임">
    <label>이미지/영상 링크 (선택) — 사진/영상 게시판용</label>
    <input id="wMedia" placeholder="https://... (jpg, png, mp4, youtube 링크)">
    <label>내용</label>
    <textarea id="wContent" placeholder="내용을 입력하세요"></textarea>
    <div class="toolbar" style="margin-top:14px;margin-bottom:0">
      <button class="btn" id="submitBtn">등록</button>
      <button class="btn sec" id="cancelBtn">취소</button>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const LS='pingpong_v1';
const CATS=[
  {k:'free', n:'자유게시판', e:'💬'},
  {k:'gear', n:'장비 리뷰', e:'🏓'},
  {k:'market', n:'중고장터', e:'🛒'},
  {k:'media', n:'사진/영상', e:'📸'},
  {k:'match', n:'같이 쳐요', e:'🤝'},
  {k:'tip', n:'팁 & 강좌', e:'📚'}
];
const catName=k=>(CATS.find(c=>c.k===k)||{n:'기타',e:'🏓'});

const SEED=[
  {id:1,cat:'free',title:'오늘 점심에 한 게임 치실 분?',author:'스매싱김',content:'점심시간에 회사 탁구대에서 한 게임 어때요? 12시 반에 모입니다!',media:'',likes:3,views:24,comments:[{who:'드라이브박',cx:'저요!',t:Date.now()-3600e3}],t:Date.now()-7200e3},
  {id:2,cat:'gear',title:'버터플라이 티모볼 ALC 한 달 사용 후기',author:'러버장인',content:'반발력 좋고 회전 잘 먹습니다. 입문 후 첫 블레이드 업그레이드로 추천해요.\n무게감은 살짝 있는 편.',media:'',likes:7,views:58,comments:[],t:Date.now()-86400e3},
  {id:3,cat:'match',title:'강남 주말 탁구 같이 치실 분 구해요',author:'주말랠리',content:'토요일 오전 강남 탁구장에서 같이 치실 분! 초중급 환영합니다.',media:'',likes:2,views:31,comments:[],t:Date.now()-2*86400e3},
  {id:4,cat:'tip',title:'포핸드 드라이브 기본기 정리',author:'코치한',content:'1) 무릎 살짝 굽히고 2) 허리 회전으로 힘 전달 3) 공은 정점에서 임팩트.\n매일 100개씩 연습하면 한 달 안에 달라집니다.',media:'',likes:11,views:90,comments:[],t:Date.now()-3*86400e3}
];

let state=load();
function load(){try{const o=JSON.parse(localStorage.getItem(LS));if(o&&o.posts)return o;}catch(e){}
  return {posts:SEED.slice(),filter:'전체',nextId:100};}
function save(){localStorage.setItem(LS,JSON.stringify(state));}

function fmt(t){const d=new Date(t),now=Date.now(),diff=(now-t)/1000;
  if(diff<60)return '방금';if(diff<3600)return Math.floor(diff/60)+'분 전';
  if(diff<86400)return Math.floor(diff/3600)+'시간 전';
  if(diff<7*86400)return Math.floor(diff/86400)+'일 전';
  return `${d.getMonth()+1}/${d.getDate()}`;}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* 카테고리 */
function renderCats(){
  const all=['전체',...CATS.map(c=>c.k)];
  $('#cats').innerHTML=all.map(k=>{
    const lab=k==='전체'?'전체':catName(k).e+' '+catName(k).n;
    const cnt=k==='전체'?state.posts.length:state.posts.filter(p=>p.cat===k).length;
    return `<div class="cat ${state.filter===k?'on':''}" data-k="${k}">${lab} ${cnt}</div>`;
  }).join('');
  $$('#cats .cat').forEach(c=>c.onclick=()=>{state.filter=c.dataset.k;save();renderList();renderCats();});
}

/* 목록 */
function renderList(){
  const q=($('#search').value||'').trim().toLowerCase();
  let posts=state.posts.slice().sort((a,b)=>b.t-a.t);
  if(state.filter!=='전체')posts=posts.filter(p=>p.cat===state.filter);
  if(q)posts=posts.filter(p=>(p.title+p.content+p.author).toLowerCase().includes(q));
  if(!posts.length){$('#list').innerHTML='<div class="empty">글이 없어요. 첫 글을 남겨보세요! ✏️</div>';return;}
  $('#list').innerHTML=posts.map(p=>{
    const c=catName(p.cat);
    const thumb=p.media&&/\.(jpg|jpeg|png|gif|webp)$/i.test(p.media)?`<img class="thumb" src="${esc(p.media)}" onerror="this.style.display='none'">`:'';
    return `<div class="post" data-id="${p.id}">${thumb}
      <div class="body">
        <div class="badge">${c.e} ${c.n}</div>
        <div class="title">${esc(p.title)}</div>
        <div class="meta"><span>👤 ${esc(p.author)}</span><span>🕒 ${fmt(p.t)}</span>
          <span>👁 ${p.views}</span><span>❤ ${p.likes}</span><span>💬 ${p.comments.length}</span></div>
      </div></div>`;
  }).join('');
  $$('#list .post').forEach(el=>el.onclick=()=>openDetail(+el.dataset.id));
}

/* 상세 */
function mediaHTML(url){
  if(!url)return '';
  if(/\.(jpg|jpeg|png|gif|webp)$/i.test(url))return `<img class="media" src="${esc(url)}" onerror="this.style.display='none'">`;
  if(/\.(mp4|webm|ogg)$/i.test(url))return `<video class="media" src="${esc(url)}" controls></video>`;
  const yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
  if(yt)return `<iframe class="media" width="100%" height="240" src="https://www.youtube.com/embed/${yt[1]}" frameborder="0" allowfullscreen></iframe>`;
  return `<div class="note">🔗 <a href="${esc(url)}" target="_blank" style="color:var(--blue)">${esc(url)}</a></div>`;
}
function openDetail(id){
  const p=state.posts.find(x=>x.id===id);if(!p)return;
  p.views++;save();
  const c=catName(p.cat);
  $('#detailView').innerHTML=`
    <button class="btn sec sm" id="backBtn">← 목록</button>
    <div style="margin-top:12px" class="badge">${c.e} ${c.n}</div>
    <h2>${esc(p.title)}</h2>
    <div class="meta">👤 ${esc(p.author)} · 🕒 ${new Date(p.t).toLocaleString('ko-KR')} · 👁 ${p.views}</div>
    ${mediaHTML(p.media)}
    <div class="content">${esc(p.content)}</div>
    <div class="likebar">
      <button class="btn sm" id="likeBtn">❤ 좋아요 ${p.likes}</button>
      <button class="btn sec sm" id="delBtn">🗑 삭제</button>
    </div>
    <div class="comments">
      <h2 style="font-size:15px;margin-bottom:10px">💬 댓글 ${p.comments.length}</h2>
      <div id="commentList"></div>
      <div class="toolbar" style="margin-top:10px">
        <input id="cWho" placeholder="닉네임" style="max-width:120px">
        <input id="cText" placeholder="댓글을 입력하세요">
        <button class="btn sm" id="cAdd">등록</button>
      </div>
    </div>`;
  renderComments(p);
  $('#listView').classList.add('hidden');$('#writeView').classList.add('hidden');
  $('#detailView').classList.remove('hidden');window.scrollTo(0,0);
  $('#backBtn').onclick=showList;
  $('#likeBtn').onclick=()=>{p.likes++;save();$('#likeBtn').textContent='❤ 좋아요 '+p.likes;};
  $('#delBtn').onclick=()=>{if(confirm('이 글을 삭제할까요?')){state.posts=state.posts.filter(x=>x.id!==id);save();showList();}};
  $('#cAdd').onclick=()=>{
    const who=($('#cWho').value||'익명').trim(),cx=$('#cText').value.trim();if(!cx)return;
    p.comments.push({who,cx,t:Date.now()});save();renderComments(p);$('#cText').value='';
  };
}
function renderComments(p){
  $('#commentList').innerHTML=p.comments.length?p.comments.map(c=>
    `<div class="comment"><span class="who">${esc(c.who)}</span><span class="ct">${fmt(c.t)}</span>
     <div class="cx">${esc(c.cx)}</div></div>`).join(''):'<div class="note">첫 댓글을 남겨보세요.</div>';
}

/* 글쓰기 */
function showWrite(){
  $('#wCat').innerHTML=CATS.map(c=>`<option value="${c.k}" ${state.filter===c.k?'selected':''}>${c.e} ${c.n}</option>`).join('');
  $('#wTitle').value='';$('#wAuthor').value='';$('#wMedia').value='';$('#wContent').value='';
  $('#listView').classList.add('hidden');$('#detailView').classList.add('hidden');
  $('#writeView').classList.remove('hidden');window.scrollTo(0,0);
}
function submitPost(){
  const title=$('#wTitle').value.trim(),content=$('#wContent').value.trim();
  if(!title){alert('제목을 입력하세요');return;}
  if(!content){alert('내용을 입력하세요');return;}
  state.posts.push({id:state.nextId++,cat:$('#wCat').value,title,
    author:($('#wAuthor').value||'익명').trim(),content,media:$('#wMedia').value.trim(),
    likes:0,views:0,comments:[],t:Date.now()});
  save();showList();
}
function showList(){
  $('#detailView').classList.add('hidden');$('#writeView').classList.add('hidden');
  $('#listView').classList.remove('hidden');renderCats();renderList();window.scrollTo(0,0);
}

/* 이벤트 */
$('#writeBtn').onclick=showWrite;
$('#submitBtn').onclick=submitPost;
$('#cancelBtn').onclick=showList;
$('#search').addEventListener('input',renderList);

/* 초기 */
renderCats();renderList();
</script>
</body>
</html>
