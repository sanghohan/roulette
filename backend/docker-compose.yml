# 기본: H2 파일 DB (무료, 컨테이너 1개만 띄움)
# 데이터는 ./data 에 영속 저장됩니다.
services:
  api:
    build: .
    container_name: pingpong-api
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      # 프론트엔드 도메인 추가/변경 시 여기서 조정
      APP_CORS_ALLOWED_ORIGINS: "https://www.donjiral.net,https://donjiral.net"

