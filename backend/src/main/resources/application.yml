server:
  port: 8080
  tomcat:
    # 거대한 요청 본문으로 디스크·메모리를 태우는 것을 컨테이너 단에서 먼저 막습니다.
    max-http-form-post-size: 1MB
    max-swallow-size: 2MB
    connection-timeout: 15s

spring:
  application:
    name: pingpong-backend

  # ===== 기본 프로필: H2 파일 DB (무료, 추가 인프라 불필요) =====
  datasource:
    url: jdbc:h2:file:/app/data/pingpong;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  h2:
    console:
      # ⚠️ 켜두면 /h2-console 로 누구나 DB에 붙을 수 있습니다.
      # 개발 PC에서만 H2_CONSOLE=true 로 켜세요.
      enabled: ${H2_CONSOLE:false}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 메일 알림 (Gmail SMTP 권장). 비밀번호=앱 비밀번호는 환경변수로만
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# 프론트엔드 허용 출처 (CORS)
app:
  cors:
    allowed-origins: >-
      https://www.donjiral.net,
      https://donjiral.net,
      http://localhost:8000,
      http://127.0.0.1:5500
  admin:
    secret: ${ADMIN_SECRET:}              # 관리자 암호(예약 이름 사용). 비우면 예약 이름 아무도 못 씀
    reserved-authors: 돈지랄               # 쉼표로 여러 개 가능. 예: 돈지랄,관리자
  alert:
    to: sanghohan@gmail.com        # 크레딧 부족 알림 받을 주소
    cooldown-minutes: 60           # 같은 알림 재발송 최소 간격
  aicheck:
    # 비밀 아님 → 소스에 직접. (API 키만 환경변수)
    provider: replicate                    # 비우면 데모 추정
    api-url: https://api.replicate.com/v1
    api-key: ${AICHECK_API_KEY:}           # 🔑 비밀: 환경변수로만
    image-model: yorickvp/llava-13b        # 비전 모델(owner/name)
  s3:
    # 비밀 아님 → 소스에 직접. (인증은 EC2 IAM Role)
    #
    # ⚠️ 2026-07 비용 이상 감지 이후 업로드를 전면 차단했습니다.
    # false 이면 /api/uploads, /api/uploads/temp 가 모두 503 을 돌려주고
    # S3 에는 아무것도 올라가지 않습니다. 다시 켜기 전에
    # docs/S3-이미지업로드-설정.md 의 라이프사이클/예산 알림 설정을 먼저 끝내세요.
    enabled: false
    bucket: s3-donjiral-uploads
    region: ap-southeast-2                  # 시드니
    key-prefix: uploads/
    temp-key-prefix: tmp/                   # aicheck 임시본 (1일 뒤 자동 삭제 규칙 필요)
    public-base-url: ""

  # 업로드 1건당 용량 상한 (spring.servlet.multipart 가 1차, 여기가 2차 방어선)
  upload:
    max-image-bytes: 5242880        # 5MB
    max-video-bytes: 10485760       # 10MB
    global-bytes-per-day: 2147483648  # 하루 총 2GB

  ratelimit:
    api-per-min: 120
    aicheck-per-min: 6
    aicheck-per-day: 50
    aicheck-global-per-day: 1000
    upload-per-hour: 20
    upload-per-day: 50
    upload-global-per-day: 2000
    visit-per-day: 20               # IP당 하루 방문 카운트 기록 횟수

---
# ===== 운영 프로필: PostgreSQL (예: AWS RDS / EC2 내 설치) =====
# 실행: java -jar app.jar --spring.profiles.active=postgres
# 환경변수 DB_URL, DB_USER, DB_PASSWORD 설정 후 사용
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pingpong}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:pingpong}
    password: ${DB_PASSWORD:pingpong}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
