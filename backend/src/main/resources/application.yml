server:
  port: 8080

spring:
  application:
    name: pingpong-backend

  # ===== 기본 프로필: H2 파일 DB (무료, 추가 인프라 불필요) =====
  datasource:
    url: jdbc:h2:file:/app/data/pingpong;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  h2:
    console:
      enabled: true      # http://localhost:8080/h2-console (개발용)

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  # 메일 알림 (Gmail SMTP 권장). 비밀번호=앱 비밀번호는 환경변수로만
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# 프론트엔드 허용 출처 (CORS)
app:
  cors:
    allowed-origins: >-
      https://www.donjiral.net,
      https://donjiral.net,
      http://localhost:8000,
      http://127.0.0.1:5500
  admin:
    secret: ${ADMIN_SECRET:}              # 관리자 암호(예약 이름 사용). 비우면 예약 이름 아무도 못 씀
    reserved-authors: 돈지랄               # 쉼표로 여러 개 가능. 예: 돈지랄,관리자
  alert:
    to: sanghohan@gmail.com        # 크레딧 부족 알림 받을 주소
    cooldown-minutes: 60           # 같은 알림 재발송 최소 간격
  aicheck:
    # 비밀 아님 → 소스에 직접. (API 키만 환경변수)
    provider: replicate                    # 비우면 데모 추정
    api-url: https://api.replicate.com/v1
    api-key: ${AICHECK_API_KEY:}           # 🔑 비밀: 환경변수로만
    image-model: yorickvp/llava-13b        # 비전 모델(owner/name)
  s3:
    # 비밀 아님 → 소스에 직접. (인증은 EC2 IAM Role)
    enabled: true
    bucket: s3-donjiral-uploads
    region: ap-southeast-2                  # 시드니
    key-prefix: uploads/
    public-base-url: ""

---
# ===== 운영 프로필: PostgreSQL (예: AWS RDS / EC2 내 설치) =====
# 실행: java -jar app.jar --spring.profiles.active=postgres
# 환경변수 DB_URL, DB_USER, DB_PASSWORD 설정 후 사용
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pingpong}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:pingpong}
    password: ${DB_PASSWORD:pingpong}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
