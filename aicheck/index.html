<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
  :root{
    --bg:#0f1226; --card:#171a33; --card2:#222647; --line:#2e3566;
    --txt:#eef1ff; --sub:#9aa3d4; --accent:#06b6d4; --accent2:#f472b6;
    --good:#4ade80; --warn:#fbbf24; --bad:#ff6b6b; --blue:#60a5fa;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI','Apple SD Gothic Neo',system-ui,sans-serif}
  body{background:radial-gradient(1200px 600px at 50% -10%,#10324a,#0f1226);color:var(--txt);min-height:100vh;padding:20px}
  .wrap{max-width:720px;margin:0 auto}
  header{text-align:center;margin-bottom:14px}
  header h1{font-size:28px;letter-spacing:-.5px}
  header p{color:var(--sub);margin-top:6px;font-size:14px}
  .nav{text-align:center;margin-top:10px;font-size:13px}
  .nav a{color:var(--blue);text-decoration:none;margin:0 7px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
  .inrow{display:flex;gap:8px;flex-wrap:wrap}
  .inrow input{flex:1;min-width:180px;background:#0e1230;border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:13px 14px;font-size:15px}
  .btn{background:var(--accent);color:#062b33;border:none;border-radius:11px;padding:13px 20px;font-size:15px;font-weight:800;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)} .btn:disabled{opacity:.5;cursor:default}
  .modes{display:flex;gap:8px;margin-bottom:12px}
  .modebtn{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:14px;font-weight:700;cursor:pointer}
  .modebtn.on{background:var(--accent);color:#062b33;border-color:var(--accent)}
  .hidden{display:none}
  .disclaimer{background:#3a2f1a;border:1px solid #6e5a2a;color:#ffe6b0;border-radius:12px;padding:11px 14px;font-size:12.5px;margin-top:14px;line-height:1.6}
  .result{margin-top:18px;display:none}
  .vidhead{display:flex;gap:12px;align-items:center;margin-bottom:16px}
  .vidhead img{width:120px;border-radius:10px;flex-shrink:0}
  .vidhead .t{font-size:15px;font-weight:600;line-height:1.4}
  .vidhead .a{font-size:12px;color:var(--sub);margin-top:3px}
  .bignum{text-align:center;font-size:64px;font-weight:900;line-height:1;margin:8px 0 2px;letter-spacing:-1px}
  .bigcap{text-align:center;font-size:13px;color:var(--sub);margin-bottom:10px}
  .verdict{text-align:center;font-size:19px;font-weight:800;margin:4px 0 18px}
  .gauge{margin:14px 0}
  .gauge .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
  .gauge .lab b{font-size:16px}
  .bar{height:14px;border-radius:8px;background:#0e1230;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;border-radius:8px;transition:width .8s ease}
  .demo-badge{display:inline-block;background:#4a3a2a;color:#ffd9a0;border:1px solid #6e5a2a;border-radius:6px;padding:2px 8px;font-size:11px;margin-left:6px}
  .ad{margin:18px 0;min-height:90px;border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#5a6296;font-size:12px;background:#11142b}
  .note{color:var(--sub);font-size:12px;line-height:1.6;margin-top:10px}
  .err{background:#3a2a2a;border:1px solid #6e4a4a;color:#ffd0d0;border-radius:12px;padding:11px 14px;font-size:13px;margin-top:14px;display:none}
  .spin{text-align:center;color:var(--sub);padding:24px;display:none}
  footer{text-align:center;margin-top:18px;font-size:12px}
  footer a{color:var(--sub);text-decoration:none;margin:0 6px}
  @media(max-width:600px){
    body{padding:12px} header h1{font-size:23px}
    .vidhead img{width:90px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔍 이거 AI로 만든 거야?</h1>
    <p>유튜브 링크를 넣으면 영상·음원이 AI로 생성됐을 확률을 추정해요</p>
    <div class="nav"><a href="/aicheck/">🔍 AI판별</a> · <a href="/dev/">🤖 AI개발</a> · <a href="/roulette/">🍽️ 메뉴</a> · <a href="/outfit/">👕 의상</a> · <a href="/pingpong/">🏓 탁구</a></div>
  </header>

  <!-- 상단 광고 -->
  <div class="ad" id="adTop">광고 영역 (애드센스 승인 후 표시)</div>

  <div class="card">
    <div class="modes">
      <button class="modebtn on" data-m="yt">🎬 유튜브 영상</button>
      <button class="modebtn" data-m="img">🖼️ 사진</button>
    </div>
    <div id="ytInput" class="inrow">
      <input id="url" placeholder="https://www.youtube.com/watch?v=..." />
      <button class="btn" id="goYt">분석하기</button>
    </div>
    <div id="imgInput" class="hidden">
      <div class="inrow">
        <input type="file" id="imgFile" accept="image/*" style="flex:1">
        <button class="btn" id="goImg">분석하기</button>
      </div>
      <input id="imgUrl" placeholder="또는 이미지 URL 붙여넣기 (https://...)" style="margin-top:8px;width:100%;background:#0e1230;border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px 14px;font-size:15px">
    </div>
    <div class="disclaimer">
      ⚠️ 결과는 <b>참고용 추정치</b>예요.
    </div>

    <div class="spin" id="spin">🔎 분석 중…</div>
    <div class="err" id="err"></div>

    <div class="result" id="result">
      <div class="vidhead">
        <img id="thumb" src="" alt="">
        <div>
          <div class="t" id="vtitle"></div>
          <div class="a" id="vauthor"></div>
        </div>
      </div>
      <div class="bignum" id="bigNum">--%</div>
      <div class="bigcap">AI로 생성됐을 확률 (영상/화면 기준)</div>
      <div class="verdict" id="verdict"></div>

      <div class="gauge">
        <div class="lab"><span>🎬 영상(화면) AI 확률</span><b id="videoN">0%</b></div>
        <div class="bar"><i id="videoBar" style="width:0%"></i></div>
      </div>
      <div class="gauge" style="opacity:.55">
        <div class="lab"><span>🎵 오디오/음원</span><b style="font-size:13px">지원 예정</b></div>
        <div class="bar"><i style="width:100%;background:repeating-linear-gradient(45deg,#2e3566,#2e3566 8px,#222647 8px,#222647 16px)"></i></div>
        <div class="note" style="margin-top:4px">오디오(음성·음악) AI 판별은 현재 지원하지 않아요.</div>
      </div>

      <!-- 결과 하단 광고 -->
      <div class="ad" id="adResult">광고 영역 (애드센스 승인 후 표시)</div>

      <div class="note" id="resultNote"></div>
    </div>
  </div>

  <footer>
    <a href="/privacy/">개인정보처리방침</a> · <span style="color:#444">© donjiral.net</span>
  </footer>
</div>

<script>
const $=s=>document.querySelector(s);
let API_BASE="https://api.donjiral.net";
API_BASE=localStorage.getItem('pingpong_api')||API_BASE;

function colorFor(p){return p>=70?'var(--bad)':p>=40?'var(--warn)':'var(--good)';}

let mode='yt';
function setMode(m){
  mode=m;
  document.querySelectorAll('.modebtn').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#ytInput').classList.toggle('hidden',m!=='yt');
  $('#imgInput').classList.toggle('hidden',m!=='img');
  $('#result').style.display='none';$('#err').style.display='none';
}
document.querySelectorAll('.modebtn').forEach(b=>b.onclick=()=>setMode(b.dataset.m));

function render(d){
  $('#thumb').src=d.thumbnail||'';$('#thumb').style.display=d.thumbnail?'':'none';
  $('#vtitle').textContent=d.title||(mode==='img'?'업로드한 사진':'(제목 없음)');
  $('#vauthor').textContent=d.author?('채널: '+d.author):'';
  $('#bigNum').textContent=d.videoAiProbability+'%';$('#bigNum').style.color=colorFor(d.videoAiProbability);
  $('#verdict').innerHTML=d.verdict+(d.demo?'<span class="demo-badge">데모 추정</span>':'');
  $('#videoN').textContent=d.videoAiProbability+'%';
  $('#videoBar').style.width=d.videoAiProbability+'%';$('#videoBar').style.background=colorFor(d.videoAiProbability);
  $('#resultNote').textContent=d.note||'';
  $('#result').style.display='block';
}
async function postJson(path,bodyObj){
  const r=await fetch(API_BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(bodyObj)});
  if(!r.ok){let m='요청 실패 ('+r.status+')';try{const j=await r.json();if(j.message)m=j.message;}catch(e){}throw new Error(m);}
  return r.json();
}
function busy(on){['goYt','goImg'].forEach(id=>{const b=$('#'+id);if(b)b.disabled=on;});
  $('#spin').style.display=on?'block':'none';if(on){$('#result').style.display='none';$('#err').style.display='none';}}
function showErr(msg){$('#err').textContent='⚠️ '+msg;$('#err').style.display='block';}

async function analyzeYt(){
  const url=$('#url').value.trim();
  if(!url){alert('유튜브 URL을 입력하세요');return;}
  busy(true);
  try{ render(await postJson('/api/aicheck',{url})); }
  catch(e){ showErr(e.message); }
  finally{ busy(false); }
}
async function analyzeImg(){
  const file=$('#imgFile').files[0];
  let imageUrl=$('#imgUrl').value.trim();
  if(!file&&!imageUrl){alert('사진 파일을 올리거나 이미지 URL을 입력하세요');return;}
  busy(true);
  try{
    if(file){
      const fd=new FormData();fd.append('file',file);
      const r=await fetch(API_BASE+'/api/uploads',{method:'POST',body:fd});
      if(!r.ok){let m='업로드 실패 ('+r.status+')';try{const j=await r.json();if(j.message)m=j.message;}catch(e){}throw new Error(m);}
      imageUrl=(await r.json()).url;
    }
    render(await postJson('/api/aicheck/image',{imageUrl}));
  }catch(e){ showErr(e.message); }
  finally{ busy(false); }
}
$('#goYt').onclick=analyzeYt;
$('#goImg').onclick=analyzeImg;
$('#url').addEventListener('keydown',e=>{if(e.key==='Enter')analyzeYt();});
$('#imgUrl').addEventListener('keydown',e=>{if(e.key==='Enter')analyzeImg();});
</script>
</body>
</html>
